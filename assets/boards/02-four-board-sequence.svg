<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="960" viewBox="0 0 1680 960">
  <rect width="1680" height="960" fill="#fdf0e0"/>
  <rect x="70" y="70" width="1540" height="160" fill="#375dfe"/>
  <text x="122" y="150" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="68" font-weight="800">四张画板，各自完成一件事</text>
  <text x="122" y="200" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="28">默认 4 张；只有 3 个独立阅读任务时收敛为 3 张</text>

  <rect x="90" y="326" width="352" height="358" fill="#375dfe" stroke="#1a2240" stroke-width="4"/>
  <text x="140" y="406" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="700">01</text>
  <text x="140" y="480" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="42" font-weight="800">总览锚点</text>
  <text x="140" y="540" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">对象</text>
  <text x="140" y="586" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">核心判断</text>
  <text x="140" y="632" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">下一步</text>

  <line x1="448" y1="505" x2="458" y2="505" stroke="#2741c0" stroke-width="5"/>
  <polyline points="448,493 462,505 448,517" fill="none" stroke="#2741c0" stroke-width="5"/>

  <rect x="472" y="326" width="352" height="358" fill="#ffffff" stroke="#1a2240" stroke-width="4"/>
  <text x="522" y="406" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="700">02</text>
  <text x="522" y="480" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="42" font-weight="800">证据地图</text>
  <text x="522" y="540" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">来源</text>
  <text x="522" y="586" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">行为信号</text>
  <text x="522" y="632" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">指向</text>

  <line x1="830" y1="505" x2="840" y2="505" stroke="#2741c0" stroke-width="5"/>
  <polyline points="830,493 844,505 830,517" fill="none" stroke="#2741c0" stroke-width="5"/>

  <rect x="854" y="326" width="352" height="358" fill="#ffffff" stroke="#1a2240" stroke-width="4"/>
  <text x="904" y="406" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="700">03</text>
  <text x="904" y="480" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="42" font-weight="800">状态判断</text>
  <text x="904" y="540" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">当前强弱</text>
  <text x="904" y="586" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">转折</text>
  <text x="904" y="632" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">待确认</text>

  <line x1="1212" y1="505" x2="1222" y2="505" stroke="#2741c0" stroke-width="5"/>
  <polyline points="1212,493 1226,505 1212,517" fill="none" stroke="#2741c0" stroke-width="5"/>

  <rect x="1236" y="326" width="352" height="358" fill="#375dfe" stroke="#1a2240" stroke-width="4"/>
  <text x="1286" y="406" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="700">04</text>
  <text x="1286" y="480" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="42" font-weight="800">行动落点</text>
  <text x="1286" y="540" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">真实场景</text>
  <text x="1286" y="586" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">具体动作</text>
  <text x="1286" y="632" fill="#ffffff" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="27">验收触发</text>

  <rect x="90" y="758" width="1500" height="104" fill="#ffffff" stroke="#2741c0" stroke-width="4"/>
  <text x="140" y="824" fill="#1a2240" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="30" font-weight="700">顺序就是阅读逻辑：先给主旨，再让证据、判断和行动各就各位。</text>
</svg>
